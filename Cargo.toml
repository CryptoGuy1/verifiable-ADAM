[workspace]
members = ["crates/protocol", "crates/verification", "crates/reference", "crates/cache", "crates/replay", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
veri-adam-protocol = { path = "crates/protocol" }
veri-adam-verification = { path = "crates/verification" }
veri-adam-reference = { path = "crates/reference" }
veri-adam-cache = { path = "crates/cache" }
veri-adam-replay = { path = "crates/replay" }
ed25519-dalek = "=3.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
hex = "=0.4.3"

[profile.release]
lto = "thin"
codegen-units = 1

