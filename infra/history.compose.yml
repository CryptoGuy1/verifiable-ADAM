name: veri-adam-history
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.30.2
    ports:
      - "127.0.0.1:8091:8080"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      ENABLE_MODULES: text2vec-transformers
      TRANSFORMERS_INFERENCE_API: http://transformers:8080
      CLUSTER_HOSTNAME: veri-adam-history
      QUERY_DEFAULTS_LIMIT: "5"
    volumes:
      - history:/var/lib/weaviate
    depends_on:
      - transformers
  transformers:
    image: cr.weaviate.io/semitechnologies/transformers-inference:sentence-transformers-all-MiniLM-L6-v2
    environment:
      ENABLE_CUDA: "0"
volumes:
  history:
